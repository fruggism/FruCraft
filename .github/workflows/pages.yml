# Tests every branch, and publishes the app to GitHub Pages from whichever
# branch is the repository's default one.
#
# Pages must be switched on once by the repository owner:
#   Settings -> Pages -> Source: GitHub Actions
# The workflow cannot do it: creating a Pages site is refused to the Actions
# token ("Resource not accessible by integration"), whatever permissions the
# workflow asks for.
name: Test e pubblica Cube-Atlas

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The project has no dependencies, so there is nothing to install.
      - run: npm test

  deploy:
    name: Pubblica su Pages
    needs: test
    # The github-pages environment only accepts deployments from the default
    # branch, so don't even try from the others.
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          # Static files: no build step, nothing to compile.
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
